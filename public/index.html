<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Gaming Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a0033 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            backdrop-filter: blur(10px);
            background: rgba(20, 20, 40, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.7rem 1.2rem;
            border-radius: 50px;
            width: 300px;
            transition: all 0.3s ease;
        }

        .search-bar:focus-within {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(0, 212, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .search-bar input {
            background: none;
            border: none;
            outline: none;
            color: #fff;
            flex: 1;
            font-size: 0.9rem;
        }

        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .api-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 2s infinite;
        }

        .status-dot.offline {
            background: #ff0055;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .hero {
            margin-bottom: 3rem;
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 1.5rem;
        }

        .filter-tags {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .tag-btn {
            padding: 0.6rem 1.2rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .tag-btn:hover {
            background: rgba(0, 212, 255, 0.2);
            border-color: rgba(0, 212, 255, 0.5);
        }

        .tag-btn.active {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            border-color: transparent;
            color: #000;
            font-weight: 600;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .game-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            height: 350px;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-8px);
            border-color: rgba(0, 212, 255, 0.5);
            box-shadow: 0 20px 40px rgba(0, 212, 255, 0.2);
        }

        .game-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: rgba(0, 0, 0, 0.3);
        }

        .game-info {
            padding: 1.2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .game-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.3;
            color: #fff;
        }

        .game-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 1rem;
        }

        .game-tag {
            font-size: 0.7rem;
            padding: 0.3rem 0.6rem;
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            border-radius: 4px;
            font-weight: 600;
        }

        .play-btn {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: #000;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: auto;
        }

        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.4);
        }

        .play-btn.loading {
            opacity: 0.7;
            cursor: not-allowed;
            pointer-events: none;
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: linear-gradient(135deg, #0f0f1e 0%, #1a0033 100%);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 16px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.2);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .close-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        .modal-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .modal-description {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .game-cover {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .status-message {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-weight: 600;
            text-align: center;
        }

        .status-message.success {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.5);
        }

        .status-message.error {
            background: rgba(255, 0, 85, 0.2);
            color: #ff0055;
            border: 1px solid rgba(255, 0, 85, 0.5);
        }

        .status-message.loading {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.5);
        }

        .game-counter {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: rgba(255, 255, 255, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <div class="logo">🎮 STRATUS</div>
            <div class="search-bar">
                <span>🔍</span>
                <input type="text" id="searchInput" placeholder="Search games...">
            </div>
        </div>
        <div class="api-status">
            <div class="status-dot" id="statusDot"></div>
            <span id="apiStatus">Connecting...</span>
        </div>
    </header>

    <div class="container">
        <div class="hero">
            <h1>Cloud Gaming Library</h1>
            <p>Stream premium games instantly. No downloads. No waiting.</p>
        </div>

        <div class="filter-tags" id="filterTags"></div>
        <div class="game-counter" id="gameCounter"></div>

        <div class="games-grid" id="gamesGrid"></div>
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-state-icon">🎮</div>
            <p>No games found matching your filters</p>
        </div>
    </div>

    <div class="modal" id="gameModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <footer>
        <p>Powered by STRATUS Cloud Gaming Backend</p>
    </footer>

    <script>
        const API_HOST = window.location.origin;
        const API_KEY = 'test-api-key'; // For testing
        let games = [];
        let filteredGames = [];
        let allTags = new Set();
        let selectedTags = new Set();

        // Check API connectivity
        async function checkApiStatus() {
            try {
                const response = await fetch(`${API_HOST}/api/hello`);
                if (response.ok) {
                    updateStatus(true, 'API Connected');
                    return true;
                } else {
                    updateStatus(false, 'API Error');
                    return false;
                }
            } catch (error) {
                updateStatus(false, 'Offline');
                console.warn('API unreachable:', error);
                return false;
            }
        }

        function updateStatus(online, text) {
            const dot = document.getElementById('statusDot');
            const status = document.getElementById('apiStatus');
            if (online) {
                dot.classList.remove('offline');
                dot.style.animation = 'pulse 2s infinite';
            } else {
                dot.classList.add('offline');
                dot.style.animation = 'none';
            }
            status.textContent = text;
        }

        // Load games from cloud.json
        async function loadGames() {
            try {
                const response = await fetch('./cloud.json');
                games = await response.json();
                
                // Extract all unique tags
                games.forEach(game => {
                    game.tags?.forEach(tag => allTags.add(tag));
                });

                renderGames();
                renderFilterTags();
                updateGameCounter();
            } catch (error) {
                console.error('Failed to load games:', error);
                document.getElementById('gamesGrid').innerHTML = 
                    '<div class="empty-state"><div class="empty-state-icon">❌</div><p>Failed to load games</p></div>';
            }
        }

        // Render filter tags
        function renderFilterTags() {
            const container = document.getElementById('filterTags');
            container.innerHTML = '';

            const tags = Array.from(allTags).sort();
            tags.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = 'tag-btn';
                btn.textContent = tag;
                btn.onclick = () => toggleTag(tag, btn);
                container.appendChild(btn);
            });
        }

        // Toggle tag filter
        function toggleTag(tag, btn) {
            if (selectedTags.has(tag)) {
                selectedTags.delete(tag);
                btn.classList.remove('active');
            } else {
                selectedTags.add(tag);
                btn.classList.add('active');
            }
            applyFilters();
        }

        // Apply filters
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            filteredGames = games.filter(game => {
                const matchesSearch = game.name.toLowerCase().includes(searchTerm) || 
                                    game.description.toLowerCase().includes(searchTerm);
                
                if (selectedTags.size === 0) {
                    return matchesSearch;
                }

                const hasTag = game.tags?.some(tag => selectedTags.has(tag));
                return matchesSearch && hasTag;
            });

            renderGames();
            updateGameCounter();
        }

        // Render games grid
        function renderGames() {
            const grid = document.getElementById('gamesGrid');
            const empty = document.getElementById('emptyState');

            if (filteredGames.length === 0) {
                grid.innerHTML = '';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            grid.innerHTML = filteredGames.map(game => `
                <div class="game-card" onclick="openGameModal('${game.name}', '${game.game_key}', '${game.description}', '${game.cover}', ${JSON.stringify(game.tags).replace(/"/g, '&quot;')})">
                    <img src="${game.image}" alt="${game.name}" class="game-image" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22240%22 height=%22200%22%3E%3Crect fill=%22%23222%22 width=%22240%22 height=%22200%22/%3E%3C/svg%3E'">
                    <div class="game-info">
                        <div class="game-title">${game.name}</div>
                        <div class="game-tags">
                            ${(game.tags || []).slice(0, 2).map(tag => `<span class="game-tag">${tag}</span>`).join('')}
                        </div>
                        <button class="play-btn" onclick="event.stopPropagation(); launchGame('${game.game_key}', '${game.name}')">
                            <span class="spinner-placeholder">Play Now</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Update game counter
        function updateGameCounter() {
            const counter = document.getElementById('gameCounter');
            counter.textContent = `Showing ${filteredGames.length} of ${games.length} games`;
        }

        // Open game modal
        function openGameModal(name, gameKey, description, cover, tags) {
            const modal = document.getElementById('gameModal');
            const body = document.getElementById('modalBody');
            
            body.innerHTML = `
                <h2 class="modal-title">${name}</h2>
                <img src="${cover}" alt="${name}" class="game-cover" onerror="this.style.display='none'">
                <div class="game-tags">
                    ${tags.map(tag => `<span class="game-tag">${tag}</span>`).join('')}
                </div>
                <p class="modal-description">${description}</p>
                <button class="play-btn" style="width: 100%; padding: 1rem;" onclick="launchGame('${gameKey}', '${name}')">
                    Launch Game
                </button>
                <p style="text-align: center; color: rgba(255,255,255,0.5); font-size: 0.85rem; margin-top: 1rem;">Game Key: ${gameKey}</p>
            `;
            
            modal.classList.add('active');
        }

        // Close modal
        function closeModal() {
            document.getElementById('gameModal').classList.remove('active');
        }

        // Launch game
        async function launchGame(gameKey, gameName) {
            const btn = event.target.closest('.play-btn');
            const originalText = btn.innerHTML;
            btn.classList.add('loading');
            btn.innerHTML = '<span class="loading-spinner"></span>Launching...';

            try {
                // Create session via API
                const response = await fetch(`${API_HOST}/cloud/v1/createSession`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': API_KEY
                    },
                    body: JSON.stringify({ game_key: gameKey })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                // Show status message
                const statusDiv = document.createElement('div');
                statusDiv.className = 'status-message loading';
                statusDiv.textContent = `🚀 Launching ${gameName}...`;
                
                const modalBody = document.getElementById('modalBody');
                modalBody.insertBefore(statusDiv, modalBody.firstChild);

                // Parse NDJSON response
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    fullResponse += decoder.decode(value, { stream: true });
                }

                const lines = fullResponse.trim().split('\n').filter(l => l);
                const lastLine = JSON.parse(lines[lines.length - 1]);

                if (lastLine.status === 'error') {
                    statusDiv.className = 'status-message error';
                    statusDiv.textContent = `❌ Error: ${lastLine.error}`;
                } else if (lastLine.status === 'queue') {
                    statusDiv.className = 'status-message success';
                    statusDiv.textContent = `✅ Queued! Position: ${lastLine.queue_pos}`;
                } else {
                    statusDiv.className = 'status-message success';
                    statusDiv.textContent = `✅ Session started! UUID: ${lastLine.uuid?.slice(0, 8)}`;
                    
                    // Auto-close modal after 2 seconds
                    setTimeout(() => {
                        closeModal();
                        btn.classList.remove('loading');
                        btn.innerHTML = originalText;
                    }, 2000);
                }
            } catch (error) {
                console.error('Launch error:', error);
                
                const statusDiv = document.createElement('div');
                statusDiv.className = 'status-message error';
                statusDiv.textContent = `❌ Failed to launch: ${error.message}`;
                
                const modalBody = document.getElementById('modalBody');
                modalBody.insertBefore(statusDiv, modalBody.firstChild);
            } finally {
                btn.classList.remove('loading');
                btn.innerHTML = originalText;
            }
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('gameModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('gameModal')) closeModal();
        });

        // Initialize
        checkApiStatus();
        setInterval(checkApiStatus, 30000); // Check every 30 seconds
        loadGames();

        // Refresh API status every 30 seconds
        setInterval(() => checkApiStatus(), 30000);
    </script>
</body>
</html>
